<!-- Директория: layouts/_default/baseof.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — о. Георгий Эдельштейн{{ end }}</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Lora', Georgia, serif;
      word-break: break-word;
      background-color: #f8fafc;
      font-size: 1.125rem;
    }
    .font-sans, .font-sans-ui, nav, header, button, input {
      font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
    }
    .comment-entry {
      transition: border-color 0.15s ease;
      word-break: break-word;
      overflow-wrap: break-word;
      border-left: 4px solid #059669 !important;
      background: #ffffff !important;
    }
    article img {
      max-width: 100% !important;
      height: auto !important;
      border-radius: 8px;
      margin: 1.25rem auto;
      display: block;
    }
  </style>
</head>
<body class="bg-slate-50 text-gray-800 antialiased min-h-screen flex flex-col w-full pt-16 text-base sm:text-lg">

  <!-- Фиксированная плавающая шапка: Имя автора слева, кнопка Автор справа -->
  <header class="w-full bg-white/95 backdrop-blur-md border-b border-gray-200 fixed top-0 left-0 right-0 z-50 shadow-xs">
    <div class="max-w-5xl mx-auto px-3 sm:px-4 py-2.5 sm:py-3 flex items-center justify-between gap-2 sm:gap-4">
      <a href="/" class="font-sans text-sm sm:text-base font-bold tracking-tight text-gray-900 hover:text-emerald-800 transition-colors whitespace-nowrap">
        о. Георгий Эдельштейн
      </a>
      
      <form action="/search/" method="GET" class="hidden sm:block flex-grow max-w-md relative mx-4">
        <input type="text" name="q" placeholder="Поиск по архиву..." 
               class="w-full px-4 py-1.5 pl-10 bg-gray-100 border border-transparent rounded-lg text-sm text-gray-900 placeholder-gray-500 focus:outline-none focus:bg-white focus:border-emerald-500 focus:ring-1 focus:ring-emerald-200 font-sans transition-all">
        <svg class="absolute left-3 top-2 w-4 h-4 text-gray-400 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </form>

      <nav class="flex items-center gap-1.5 sm:gap-2 shrink-0 font-sans">
        <a href="/search/" class="sm:hidden px-2 py-1.5 text-gray-600 hover:text-emerald-800 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </a>
        <a href="/author/" class="px-3 sm:px-3.5 py-1 sm:py-1.5 rounded-lg text-xs sm:text-sm font-medium tracking-normal {{ if eq .RelPermalink "/author/" }}bg-emerald-100 text-emerald-900 border border-emerald-200 font-semibold{{ else }}text-gray-600 hover:text-emerald-800 hover:bg-gray-100 border border-transparent{{ end }} transition-colors whitespace-nowrap">
          Об авторе
        </a>
      </nav>
    </div>
  </header>

  <!-- Главный контейнер страниц -->
  <div class="flex-grow w-full">
    {{ block "main" . }}{{ end }}
  </div>

  <!-- Подвал сайта -->
  <footer class="w-full border-t border-gray-200 bg-white py-6 mt-16 font-sans">
    <div class="max-w-5xl mx-auto px-4 flex items-center justify-center text-sm text-gray-500">
      <a href="https://g-edelstein.livejournal.com" target="_blank" rel="noopener" class="hover:text-emerald-800 transition-colors inline-flex items-center gap-1">
        LiveJournal ↗
      </a>
    </div>
  </footer>

</body>
</html>
