name: Preview LJ import
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: LiveJournal post ID
        required: true
        default: '38505'
      min_date:
        description: Minimum publication date
        required: true
        default: '2026-10-29'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements.txt
          python -m py_compile fetch_new_posts.py
          python -m unittest discover -s tests -v
      - name: Preview one post
        env:
          POST_ID: ${{ inputs.post_id }}
          MIN_DATE: ${{ inputs.min_date }}
        run: python fetch_new_posts.py --post-id "$POST_ID" --output-dir /tmp/lj-preview --min-date "$MIN_DATE"
      - uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3
        with:
          name: lj-preview
          path: /tmp/lj-preview/
          if-no-files-found: error
          retention-days: 7
